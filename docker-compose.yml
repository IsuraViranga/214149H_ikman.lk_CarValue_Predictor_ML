# Local development stack — Flask API + React UI.
# Start with:  docker compose up --build
# Stop with:   docker compose down

services:
  backend:
    build: ./app/backend
    container_name: carvalue-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      # Origins allowed to call the API (the frontend container below)
      CORS_ORIGINS: http://localhost:3000
    healthcheck:
      # Confirms Flask is up AND the .pkl artifacts deserialized
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
      args:
        # Baked into the JS bundle at build time. This is the URL the
        # BROWSER uses, so it is localhost — not the container name.
        REACT_APP_API_URL: http://localhost:5000/api
    container_name: carvalue-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
