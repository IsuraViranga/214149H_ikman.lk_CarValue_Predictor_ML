# Local development stack — Flask API + React UI.
# Start with:  docker compose up --build
# Stop with:   docker compose down

services:
  backend:
    build: ./app/backend
    container_name: carvalue-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      # Origins allowed to call the API (the frontend container below)
      CORS_ORIGINS: http://localhost:3000
      # `db` resolves via compose's embedded DNS -- container-to-container,
      # so the service name works here (unlike REACT_APP_API_URL below).
      DATABASE_URL: postgresql://carvalue:carvalue@db:5432/carvalue
      # Local throwaway value. Production uses a strong random secret set
      # only in Render's dashboard -- anyone holding it can forge tokens.
      JWT_SECRET_KEY: dev-secret-not-for-production
    healthcheck:
      # Confirms Flask is up AND the .pkl artifacts deserialized
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: carvalue-db
    environment:
      POSTGRES_USER: carvalue
      POSTGRES_PASSWORD: carvalue
      POSTGRES_DB: carvalue
    ports:
      # Exposed so you can inspect it with psql or a GUI client.
      # If port 5432 is already taken locally, change this to "5433:5432".
      - "5432:5432"
    volumes:
      # Named volume, so users survive `docker compose down`.
      - carvalue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carvalue -d carvalue"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
      args:
        # Baked into the JS bundle at build time. This is the URL the
        # BROWSER uses, so it is localhost — not the container name.
        REACT_APP_API_URL: http://localhost:5000/api
    container_name: carvalue-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  carvalue_pgdata:
