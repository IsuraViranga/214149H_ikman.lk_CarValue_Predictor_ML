# CI pipeline for CarValueLK.
#
# Runs on every push to main and on every pull request. The two test jobs run
# in parallel on separate machines, so the wall-clock time is the slower of the
# two rather than the sum.
#
# The deploy job is added in 4d, once this is proven to go both green and red.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If you push twice quickly, cancel the older run instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Backend: pytest against a real Postgres, matching production.
  # ---------------------------------------------------------------------
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    # A "service container" is a sidecar that GitHub starts alongside the job
    # and tears down after. Same postgres:16-alpine as docker-compose, so the
    # tests hit the same engine version locally and in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carvalue
          POSTGRES_PASSWORD: carvalue
          POSTGRES_DB: carvalue
        ports:
          - 5432:5432
        # The job must not start querying before Postgres is accepting
        # connections -- the same readiness problem docker-compose solves
        # with depends_on: condition: service_healthy.
        options: >-
          --health-cmd "pg_isready -U carvalue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          # Same minor version as the Dockerfile's python:3.11-slim.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt

      - name: Install the OpenMP runtime
        # XGBoost is compiled against OpenMP and fails to import without
        # libgomp.so.1 -- the same reason the Dockerfile installs libgomp1.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgomp1

      - name: Install dependencies
        working-directory: app/backend
        # requirements-dev.txt starts with "-r requirements.txt", so this
        # installs the production pins plus pytest.
        #
        # NOTE: no --no-cache-dir here, unlike the Dockerfile. There the flag
        # keeps the image small; here it would defeat `cache: pip` above and
        # make the post-job cache step fail with an empty cache folder.
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: app/backend
        env:
          # conftest.py appends /carvalue_test and creates that database.
          # localhost here, not "db" -- service containers are published onto
          # the runner's own network, unlike compose's private DNS.
          TEST_DATABASE_BASE: postgresql://carvalue:carvalue@localhost:5432
        run: python -m pytest tests -q

  # ---------------------------------------------------------------------
  # Frontend: the production build must actually compile.
  # ---------------------------------------------------------------------
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          # Matches the frontend Dockerfile and netlify.toml.
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install from the lockfile
        working-directory: app/frontend
        # npm ci, not npm install: it refuses to run if package.json and
        # package-lock.json disagree. This is exactly the check that would
        # have caught the typescript@5.9.3 conflict before it reached Docker.
        run: npm ci

      - name: Build
        working-directory: app/frontend
        env:
          # CRA treats warnings as errors when CI=true. Match netlify.toml.
          CI: "false"
          # Baked into the bundle at build time -- the browser cannot read
          # container env vars, so this must be set here, not at deploy.
          REACT_APP_API_URL: https://carvalue-api-mv6s.onrender.com/api
        run: npm run build

      - name: Upload the built site
        # An "artifact" hands files from one job to another. Jobs run on
        # separate machines with separate disks, so this is the only way the
        # deploy job can see what this job produced -- and it means the site
        # is built exactly once, not rebuilt for the deploy.
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: app/frontend/build
          retention-days: 1

  # ---------------------------------------------------------------------
  # Deploy: only reached when BOTH test jobs succeeded.
  #
  # Render and Netlify auto-deploy is switched OFF; this job triggers them
  # instead, which is what makes the tests an actual gate rather than a
  # report that arrives alongside a deploy already in progress.
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    # `needs` makes this wait for both jobs. If either fails or is cancelled,
    # this job never starts and nothing reaches production.
    needs: [backend-tests, frontend-build]

    # Pull requests must run the tests but must NOT deploy -- otherwise any
    # PR would publish straight to the live site.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger the Render deploy
        # -f makes curl exit non-zero on an HTTP error, so a rejected hook
        # fails this job instead of silently "succeeding".
        # -o /dev/null keeps the response body out of the log; the hook URL
        # is a secret and GitHub masks it, but there is no reason to echo it.
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" -o /dev/null
          echo "Render deploy triggered"

      - name: Fetch the built site from the frontend job
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build

      - name: Publish to Netlify
        # Uploads the already-built files. Netlify does no building of its
        # own, which is what lets us switch its git auto-deploy off and still
        # publish -- the gate is now genuinely the test jobs above.
        run: npx --yes netlify-cli@17 deploy --prod --dir=build --site "${{ secrets.NETLIFY_SITE_ID }}" --auth "${{ secrets.NETLIFY_AUTH_TOKEN }}" --message "CI ${{ github.sha }}"

      - name: Summary
        run: |
          echo "### Deployed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "Tests passed, so both deploys were triggered." >> $GITHUB_STEP_SUMMARY
          echo "- Backend: https://carvalue-api-mv6s.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: https://carvalue-lk.netlify.app" >> $GITHUB_STEP_SUMMARY
